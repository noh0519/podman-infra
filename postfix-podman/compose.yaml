services:
  postfix:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/postfix-mail:1.0
    container_name: postfix-mail
    hostname: ${MAIL_HOSTNAME:?Set MAIL_HOSTNAME in .env}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - mail-data:/var/mail/vhosts:Z
      - ./tls:/etc/postfix/tls:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null 2>&1 && test -S /var/spool/postfix/private/auth"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 10.89.0.2
        ipv6_address: fd00:2:1::2

volumes:
  mail-data:

networks:
  default:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.89.0.0/24
          gateway: 10.89.0.1
        - subnet: fd00:2:1::/64
          gateway: fd00:2:1::1
